name: Import Split Signal source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source and commit
        shell: bash
        run: |
          if [ ! -f split-signal-github-source.zip ]; then
            echo "Source already imported."
            exit 0
          fi
          unzip -o split-signal-github-source.zip
          rm split-signal-github-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import complete Split Signal game source"
          git push
